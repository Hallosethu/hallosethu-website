  <!-- Hallosethu Chatbot HTML -->
  <div id="_hs_win" role="dialog" aria-label="Hallosethu Support Chat">
    <div id="_hs_hdr">
      <div class="_hs_av">
        <svg width="24" height="24" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="4" width="8" height="20" rx="4" fill="white" fill-opacity="0.95" />
          <rect x="25" y="4" width="8" height="20" rx="4" fill="white" fill-opacity="0.75" />
          <rect x="3" y="12" width="30" height="6" rx="3" fill="#FFB74D" />
          <path d="M10 28 Q18 33 26 28" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"
            stroke-opacity="0.85" />
        </svg>
      </div>
      <div>
        <div class="_hs_hn">Hallosethu Support</div>
        <div class="_hs_hs">Online &nbsp;·&nbsp; Visakhapatnam</div>
      </div>
      <button id="_hs_close" aria-label="Close chat"><i class="ti ti-x"></i></button>
    </div>
    <div id="_hs_msgs"></div>
    <div id="_hs_bot">
      <div id="_hs_chips"></div>
      <div id="_hs_irow">
        <textarea id="_hs_inp" rows="1" placeholder="Or type your question…"></textarea>
        <button id="_hs_sbtn" aria-label="Send message"><i class="ti ti-send"></i></button>
      </div>
      <div id="_hs_foot">Powered by <a href="https://hallosethu.com" target="_blank">Hallosethu</a> &nbsp;·&nbsp; Your
        Trusted Local Friend in Vizag</div>
    </div>
  </div>

  <button id="_hs_launcher" aria-label="Open Hallosethu chat">
    <!-- Custom HS icon: two vertical bars + arch = letter H = Hallosethu -->
    <div id="_hs_logo_inner" id="_hs_lico_wrap">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" id="_hs_svg_icon">
        <!-- Left pillar of H -->
        <rect x="3" y="4" width="9" height="22" rx="4.5" fill="white" fill-opacity="0.95" />
        <!-- Right pillar of H -->
        <rect x="24" y="4" width="9" height="22" rx="4.5" fill="white" fill-opacity="0.75" />
        <!-- Cross-bar of H — gradient orange -->
        <rect x="3" y="13" width="30" height="6" rx="3" fill="url(#hgrad)" />
        <!-- Smile arc at bottom — "hello" feel -->
        <path d="M10 30 Q18 35 26 30" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"
          stroke-opacity="0.85" />
        <defs>
          <linearGradient id="hgrad" x1="3" y1="16" x2="33" y2="16" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFB74D" />
            <stop offset="1" stop-color="#FF9800" />
          </linearGradient>
        </defs>
      </svg>
    </div>
    <span id="_hs_lico_text">SETHU</span>
    <div id="_hs_notif">1</div>
  </button>
